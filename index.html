<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daigle Games</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 3rem 1rem 2rem;
      text-align: center;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border-bottom: 1px solid #2a2a4a;
    }

    header h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.5rem;
      color: #6b7280;
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 900px;
      padding: 3rem 1.5rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .game-card {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-3px);
      border-color: #7c3aed;
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.25);
    }

    .game-icon {
      font-size: 2.5rem;
      line-height: 1;
    }

    .game-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e8e8f0;
    }

    .game-play {
      margin-top: auto;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #7c3aed;
    }

    footer {
      margin-top: auto;
      padding: 2rem;
      color: #374151;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Daigle Games</h1>
    <p>Pick a game and play</p>
  </header>

  <main>
    <div class="games-grid">

      <a class="game-card" href="games/Bebe%20And%20Baba%201.html">
        <div class="game-icon">🧩</div>
        <div class="game-name">Daigle Puzzle 1</div>
        <div class="game-play">Play →</div>
      </a>

    </div>
  </main>

  <footer>© Daigle Games</footer>
</body>
</html>
